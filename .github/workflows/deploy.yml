name: Deploy

on:
    workflow_run:
        workflows: [CI]
        types: [completed]
        branches: [main]
    workflow_dispatch:

jobs:
    deploy:
        name: Deploy to VDS
        runs-on: ubuntu-latest
        if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

        steps:
            - name: Deploy via SSH
              uses: appleboy/ssh-action@v1
              with:
                  host: ${{ secrets.VDS_HOST }}
                  username: ${{ secrets.VDS_USER }}
                  key: ${{ secrets.VDS_SSH_KEY }}
                  script: |
                      cd ${{ secrets.VDS_PROJECT_PATH }}
                      git pull origin main
                      npm ci --production
                      pm2 restart ${{ secrets.VDS_APP_NAME }} || pm2 start npm --name ${{ secrets.VDS_APP_NAME }} -- run start
                      pm2 save
